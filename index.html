<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<script>
(async () => {
  const params = new URLSearchParams(window.location.search);
  const encrypted = params.get("data");

  if (!encrypted) {
    document.body.innerText = "❌ Missing ?data=";
    return;
  }

  document.body.innerText = "Decrypting...";

  try {
    const password = "joshualingus";
    const salt = new TextEncoder().encode("salt123");

    const ciphertext = Uint8Array.from(atob(encrypted), c => c.charCodeAt(0));

    const keyMaterial = await crypto.subtle.importKey(
      "raw",
      new TextEncoder().encode(password),
      "PBKDF2",
      false,
      ["deriveKey"]
    );

    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations: 10000, hash: "SHA-512" },
      keyMaterial,
      { name: "AES-CBC", length: 256 },
      false,
      ["decrypt"]
    );

    const iv = new Uint8Array(16);

    const decrypted = await crypto.subtle.decrypt(
      { name: "AES-CBC", iv },
      key,
      ciphertext
    );

    const text = new TextDecoder().decode(decrypted);

    document.body.innerText = "✅ RESULT:\n\n" + text;

  } catch (e) {
    document.body.innerText = "❌ ERROR:\n\n" + e.message;
    console.error(e);
  }
})();
</script>
