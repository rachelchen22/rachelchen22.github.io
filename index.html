<script>
(async () => {
  function getHashData() {
    return window.location.hash.substring(1); // remove "#"
  }

  const encrypted = getHashData();

  if (!encrypted) {
    document.body.innerText = "❌ No #data provided in URL";
    return;
  }

  document.body.innerText = "Decrypting...";

  try {
    const password = "joshualingus";
    const salt = new TextEncoder().encode("salt123");

    // Base64 decode (hash is NOT mangled, so safe)
    const ciphertext = Uint8Array.from(atob(encrypted), c => c.charCodeAt(0));

    const keyMaterial = await crypto.subtle.importKey(
      "raw",
      new TextEncoder().encode(password),
      "PBKDF2",
      false,
      ["deriveKey"]
    );

    const key = await crypto.subtle.deriveKey(
      {
        name: "PBKDF2",
        salt,
        iterations: 10000,
        hash: "SHA-512"
      },
      keyMaterial,
      { name: "AES-CBC", length: 256 },
      false,
      ["decrypt"]
    );

    const iv = new Uint8Array(16); // all zeros

    const decrypted = await crypto.subtle.decrypt(
      { name: "AES-CBC", iv },
      key,
      ciphertext
    );

    const text = new TextDecoder().decode(decrypted);

    document.body.innerText = text;

  } catch (err) {
    document.body.innerText = "❌ Decryption failed\n\n" + err.message;
    console.error(err);
  }
})();
</script>
