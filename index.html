<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Decrypt Debug</title>
</head>

<body>
  <pre id="out">Loading...</pre>

  <script>
window.onload = async () => {
  const out = document.getElementById("out");

  const log = (m) => out.textContent += "\n" + m;

  try {
    out.textContent = "START";

    const hash = window.location.hash.substring(1);
    log("HASH OK");

    // STEP 1: Base64 decode
    let ciphertext;
    try {
      function base64ToBytes(str) {
        str = str.replace(/-/g, '+').replace(/_/g, '/');

        while (str.length % 4) {
            str += '=';
        }

        return Uint8Array.from(atob(str), c => c.charCodeAt(0));
        }

        ciphertext = base64ToBytes(hash);
    } catch (e) {
      out.textContent = "❌ BASE64 FAILED\n" + e.message;
      return;
    }

    log("BASE64 OK (" + ciphertext.length + " bytes)");

    // STEP 2: Key derivation
    const password = "joshualingus";
    const salt = new TextEncoder().encode("salt123");

    const keyMaterial = await crypto.subtle.importKey(
      "raw",
      new TextEncoder().encode(password),
      "PBKDF2",
      false,
      ["deriveKey"]
    );

    log("KEY MATERIAL OK");

    const key = await crypto.subtle.deriveKey(
      {
        name: "PBKDF2",
        salt,
        iterations: 65536,
        hash: "SHA-256"
      },
      keyMaterial,
      { name: "AES-CBC", length: 256 },
      false,
      ["decrypt"]
    );

    log("KEY DERIVED");

    const data = ciphertext;

    // split IV + ciphertext correctly
    const iv = data.slice(0, 16);
    const actualCiphertext = data.slice(16);

    let decrypted;
    try {
    decrypted = await crypto.subtle.decrypt(
        {
        name: "AES-CBC",
        iv: iv
        },
        key,
        actualCiphertext
    );
    } catch (e) {
    out.textContent =
        "❌ AES DECRYPT FAILED\n" +
        e.name + "\n" +
        e.message;
    return;
    }

    log("DECRYPT OK");

    const text = new TextDecoder().decode(decrypted);

    out.textContent = "✅ RESULT:\n\n" + text;

  } catch (err) {
    console.error(err);
    out.textContent =
      "❌ CRASH:\n" + err.name + "\n" + err.message;
  }
};
</script>
</body>
</html>
